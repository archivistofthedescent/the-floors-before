title: The Floors Before
description: A fan-made anthology of backstories for the characters of Dungeon Crawler Carl.
editor: Archivist of the Descent
baseurl: "/the-floors-before"
url: "https://archivistofthedescent.github.io"
lang: en
author: Archivist of the Descent
plugins: [jekyll-seo-tag, jekyll-sitemap, jekyll-feed]
feed:
  collections: [chapters]
keywords: [Dungeon Crawler Carl, DCC, fan fiction, fanfic, backstory, character study, LitRPG, Matt Dinniman]
collections:
  chapters:
    output: true
    permalink: /chapters/:name/
defaults:
  - scope: { path: "", type: chapters }
    values: { layout: chapter, image: /assets/art/season-one-cover.jpg }
  - scope: { path: "" }
    values: { layout: default, image: /assets/art/season-one-cover.jpg }
exclude: [queue, scripts, STYLE.md, README.md, CONTRIBUTING.md, Gemfile, Gemfile.lock]
